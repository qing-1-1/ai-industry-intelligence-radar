<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="追踪运营商 Token、智算、模型网关、AI 产品与采购政策。">
  <title>运营商情报</title>
  <link rel="icon" href="assets/img/operator-mark.png" type="image/png">
  <link rel="stylesheet" href="assets/css/radar.css">
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-feed" viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h9"/><path d="M2 5h.01M2 12h.01M2 19h.01"/></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/></symbol>
    <symbol id="i-ai" viewBox="0 0 24 24"><path d="M12 3v4m0 10v4M3 12h4m10 0h4M5.6 5.6l2.8 2.8m7.2 7.2 2.8 2.8m0-12.8-2.8 2.8m-7.2 7.2-2.8 2.8"/><circle cx="12" cy="12" r="2"/></symbol>
    <symbol id="i-sources" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5m-18 4 9 5 9-5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M8 16 17 7m-7 0h7v7"/></symbol>
  </svg>
  <a class="skip" href="#content">跳到内容</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#featured">
        <img class="mark" src="assets/img/operator-mark.png" width="40" height="40" alt="">
        <span>运营商情报<small>行业观察</small></span>
      </a>
      <nav id="nav" aria-label="主导航">
        <p class="nav-label">阅读</p>
        <a href="#featured" data-view="featured" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-feed"/></svg>精选</a>
        <a href="#operator" data-view="operator" id="historyLink"><svg class="icon" aria-hidden="true"><use href="#i-report"/></svg>运营商简报</a>
        <a href="#ai" data-view="ai"><svg class="icon" aria-hidden="true"><use href="#i-ai"/></svg>AI 简报</a>
        <a href="#sources" data-view="sources"><svg class="icon" aria-hidden="true"><use href="#i-sources"/></svg>信息源</a>
      </nav>
      <div class="credits"><a href="https://github.com/Thysrael/Horizon">基于 Horizon</a> · <a href="https://github.com/KKKKhazix/AIHOT">界面参考 AIHOT</a></div>
    </aside>
    <aside class="report-rail" id="reportRail" aria-label="简报归档" hidden>
      <div id="reportTabs" class="report-tabs" aria-label="简报周期">
        <button type="button" data-period="daily">日报</button>
        <button type="button" data-period="weekly">周报</button>
        <button type="button" data-period="monthly">月报</button>
      </div>
      <p class="nav-label">往期简报</p>
      <div id="editionList"></div>
    </aside>
    <main id="content" class="main" tabindex="-1">
      <header class="page-head">
        <div>
          <h1 id="viewTitle">精选</h1>
          <p id="viewDescription">聚焦运营商 AI 业务和产业动态</p>
        </div>
        <div id="editionDate" class="edition-date"></div>
      </header>
      <section id="stories">
        <div class="toolbar">
          <div id="categoryTabs" class="category-tabs" aria-label="按分类浏览"></div>
          <div class="filters" id="filters">
            <label class="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" placeholder="搜索标题、摘要或标签" aria-label="搜索新闻"></label>
            <label id="archiveFilter" hidden>期次 <select id="date" aria-label="选择简报期次"></select></label>
            <select id="source" aria-label="筛选来源"><option value="">全部来源</option></select>
            <select id="sort" aria-label="排序"><option value="date">按发布时间</option><option value="score">按重要性</option></select>
          </div>
        </div>
        <div id="featuredHighlights" class="highlights" hidden></div>
        <div class="list-heading"><h2 id="listTitle">本期情报</h2><span id="resultCount"></span></div>
        <p id="status" class="status" role="status">正在读取情报…</p>
        <div id="articles"></div>
      </section>
      <section id="sourcePanel" hidden>
        <p class="source-note">搜索发现和第三方聚合的覆盖取决于各平台收录。每条情报均保留原文入口。</p>
        <div id="failures"></div>
        <div id="sourceList" class="source-grid"></div>
      </section>
    </main>
  </div>
  <dialog id="storyDialog" class="story-dialog" aria-labelledby="storyDialogTitle">
    <div class="dialog-bar"><span id="storyDialogTitle">情报详情</span><button id="closeStory" type="button" aria-label="关闭详情">关闭</button></div>
    <div id="dialogStory"></div>
  </dialog>
  <script src="assets/js/radar.js"></script>
</body>
</html>
