name: Radar daily
on:
  schedule:
    - cron: '17 0 * * *' # 08:17 Asia/Shanghai; avoids peak on the hour
  workflow_dispatch:
    inputs:
      max_candidates:
        description: Maximum AI candidates for this run (1–120)
        required: false
        default: "120"
        type: string
      dry_run:
        description: Test generation without replacing published archive
        required: false
        default: false
        type: boolean
concurrency:
  group: radar-pages
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Restore prior published archive
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            mkdir -p docs/radar-data docs/_posts data/summaries
            for path in radar-data _posts; do
              git archive origin/gh-pages "$path" 2>/dev/null | tar -x -C docs || true
            done
            for post in docs/_posts/*-summary-zh.md; do
              [ -f "$post" ] || continue
              date=$(basename "$post" -summary-zh.md)
              cp "$post" "data/summaries/horizon-${date}-zh.md"
            done
          fi
      - run: python scripts/radar_catalog.py
      - name: Generate briefing
        env:
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          RADAR_MAX_CANDIDATES: ${{ inputs.max_candidates || '120' }}
        run: |
          python scripts/radar_run_config.py
          touch "$RUNNER_TEMP/radar-run-start"
          uv run horizon --config "$RUNNER_TEMP/radar-config.json" --hours 25
      - name: Report test output
        if: ${{ inputs.dry_run }}
        run: python scripts/radar_test_report.py
      - name: Preserve archive on gh-pages
        if: ${{ !inputs.dry_run }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
      - uses: actions/configure-pages@v5
        if: ${{ !inputs.dry_run }}
      - uses: actions/jekyll-build-pages@v1
        if: ${{ !inputs.dry_run }}
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.dry_run }}
        with:
          path: ./_site
      - id: deployment
        if: ${{ !inputs.dry_run }}
        uses: actions/deploy-pages@v4
