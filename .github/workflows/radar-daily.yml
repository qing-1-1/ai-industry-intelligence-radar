name: Radar daily
on:
  schedule:
    - cron: '0 0 * * *' # 08:00 Asia/Shanghai, subject to GitHub delay
  workflow_dispatch:
concurrency:
  group: radar-publish
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Restore prior published archive
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            mkdir -p docs/radar-data docs/_posts data/summaries
            for path in radar-data _posts; do
              git archive origin/gh-pages "$path" 2>/dev/null | tar -x -C docs || true
            done
            for post in docs/_posts/*-summary-zh.md; do
              [ -f "$post" ] || continue
              date=$(basename "$post" -summary-zh.md)
              cp "$post" "data/summaries/horizon-${date}-zh.md"
            done
          fi
      - run: python scripts/radar_catalog.py
      - name: Generate briefing
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: |
          if [ -z "$HORIZON_WEBHOOK_URL" ]; then unset HORIZON_WEBHOOK_URL; fi
          uv run horizon --config data/config.radar.json --hours 48
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
