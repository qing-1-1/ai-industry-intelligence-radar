name: Deploy Docs
on:
  push:
    branches: [main]
    paths: ['docs/**', 'data/config.radar.json', 'scripts/radar_catalog.py', 'skills/horizon/**', 'LICENSE', '.github/workflows/deploy-docs.yml']
  workflow_dispatch:
concurrency:
  group: radar-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Restore prior published archive
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            for path in radar-data _posts; do
              git archive origin/gh-pages "$path" 2>/dev/null | tar -x -C docs || true
            done
          fi
      - run: python scripts/radar_catalog.py
      - name: Package Horizon skill
        run: |
          mkdir -p docs/downloads
          git archive --format=zip --prefix=horizon/ --add-file=LICENSE \
            --output=docs/downloads/horizon-skill.zip HEAD:skills/horizon
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
